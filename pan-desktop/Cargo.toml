[package]
name = "pan-player"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "PAN · Play Anything Now"

[[bin]]
name = "pan"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
libloading = "0.8"
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rfd = "0.15"

[build-dependencies]
cc = "1.2"

# PAN Desktop builds independently of the VLC development workspace.
[workspace]
